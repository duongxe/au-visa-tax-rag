# Build the images on GitHub (no local Docker needed) and run them on AWS.
#   Actions > "Deploy to AWS" > Run workflow > action = deploy | destroy
# destroy deletes the service stack (Fargate tasks + load balancer), which stops
# all hourly costs; ECR, S3, the secret and IAM roles stay (pennies per month).
# Setup: see deploy/README.md.
name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  id-token: write   # OIDC: short-lived AWS credentials, no access keys in GitHub
  contents: read

concurrency: aws-deploy

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  BOOTSTRAP_STACK: au-visa-tax-rag-bootstrap
  SERVICE_STACK: au-visa-tax-rag-service

jobs:
  deploy:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read bootstrap outputs
        id: boot
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
                    --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "repo=$(out RepositoryUri)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(out IndexBucket)" >> "$GITHUB_OUTPUT"
          echo "cfn_role=$(out ServiceStackRoleArn)" >> "$GITHUB_OUTPUT"

      - name: Download the index from S3
        run: |
          aws s3 cp "s3://${{ steps.boot.outputs.bucket }}/index/" data/index/ --recursive
          test -f data/index/faiss.index && test -f data/index/chunks.jsonl && test -f data/index/meta.json

      - name: Free disk space for the model image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        id: img
        env:
          REPO: ${{ steps.boot.outputs.repo }}
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg WITH_RERANKER=0 -t "$REPO:api-$TAG" .
          docker build -f Dockerfile.ui -t "$REPO:ui-$TAG" .
          docker push "$REPO:api-$TAG"
          docker push "$REPO:ui-$TAG"
          echo "api=$REPO:api-$TAG" >> "$GITHUB_OUTPUT"
          echo "ui=$REPO:ui-$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy the service stack
        run: |
          aws cloudformation deploy --stack-name "$SERVICE_STACK" \
            --template-file deploy/service.yml \
            --role-arn "${{ steps.boot.outputs.cfn_role }}" \
            --parameter-overrides "ApiImage=${{ steps.img.outputs.api }}" "UiImage=${{ steps.img.outputs.ui }}" \
            --no-fail-on-empty-changeset

      - name: Show URLs
        if: always()
        run: |
          aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
            --query "Stacks[0].Outputs" --output table | tee -a "$GITHUB_STEP_SUMMARY" || true
          aws cloudformation describe-stack-events --stack-name "$SERVICE_STACK" --max-items 15 \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[LogicalResourceId,ResourceStatusReason]" \
            --output table || true

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Delete the service stack
        run: |
          role=$(aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
                   --query "Stacks[0].Outputs[?OutputKey=='ServiceStackRoleArn'].OutputValue" --output text)
          aws cloudformation delete-stack --stack-name "$SERVICE_STACK" --role-arn "$role"
          aws cloudformation wait stack-delete-complete --stack-name "$SERVICE_STACK"
          echo "Service stack deleted: no more Fargate / load balancer charges." >> "$GITHUB_STEP_SUMMARY"
