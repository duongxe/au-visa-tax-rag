# docker compose up --build
#   API: http://localhost:8000/docs   UI: http://localhost:8501
services:
  api:
    build: .
    image: au-visa-tax-rag-api
    env_file: .env          # API keys; never baked into the image
    environment:
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-hybrid_rerank}
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: au-visa-tax-rag-ui
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
